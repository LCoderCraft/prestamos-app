services:
  - type: web
    name: prestamos-app
    env: php
    region: oregon
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
    startCommand: ./start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: es
      - key: APP_URL
        value: https://prestamos-app.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: prestamos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: prestamos-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: prestamos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: prestamos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: prestamos-db
          property: password
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: prestamodematerialesuas@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: prestamodematerialesuas@gmail.com
      - key: MAIL_FROM_NAME
        value: "PRESTAMO DE MATERIALES UAS"

databases:
  - name: prestamos-db
    plan: free
    region: oregon
    databaseName: prestamos_db
    ipAllowList: []
